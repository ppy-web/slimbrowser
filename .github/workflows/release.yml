name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APKs
        run: ./gradlew test assembleDebug assembleRelease

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/slimbrowser-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/slimbrowser-${GITHUB_REF_NAME}-release-unsigned.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Create GitHub Release and upload APKs
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
